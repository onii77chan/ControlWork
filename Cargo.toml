[package]
name = "tg_converter"
version = "0.1.0"
edition = "2021"

[dependencies]
teloxide = { version = "0.12", features = ["macros", "rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "time", "sync"] }
image = "0.24"
uuid = { version = "1", features = ["v4"] }
anyhow = "1.0"
lazy_static = "1.4"
log = "0.4"
pretty_env_logger = "0.5"
futures = "0.3"
